<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-kaliwa">
            <img src="/image/starbucks.png" alt="Logo" class="logo">
            <ul class="nav-links">
                <li>Menu</li>
                <li>Merchandise</li>
                <li>Rewards</li>
            </ul>
        </div>
        <div class="nav-kanan">
            <span class="store-link">Find a Store</span>
            <button class="sign-in-button">Sign In</button>
            <button class="join-now-button">Join Now</button>
        </div>
    </nav>
</body>
</html>
